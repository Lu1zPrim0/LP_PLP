{%- assign filename = include.path | split: "/" | last | split: "." | first -%}
{%- assign branch = site.github.source.branch | default: "main" -%}
<a href="https://raw.githubusercontent.com/{{ site.github.owner_name }}/{{site.github.repository_name}}/refs/heads/{{ branch }}/{{ include.path }}" target="_blank" rel="noopener noreferrer">
    {{ include.content | default: filename }}
</a>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
